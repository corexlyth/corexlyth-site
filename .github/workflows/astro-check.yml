name: CoreXLyth • Build and Content Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/content-engine-20261025, feat/search-seo-20261025, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build pages, articles and category index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Astro dependencies
        run: npm ci --no-audit --no-fund
      - name: Build static website
        run: npm run build
      - name: Verify HTML routes and all frontend assets
        run: npm run verify
      - name: Archive preview build
        uses: actions/upload-artifact@v4
        with:
          name: corexlyth-astro-preview
          path: dist/
          if-no-files-found: error
