name: CoreXLyth • Publish verified Astro output

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'scripts/check-build.mjs'
      - '.github/workflows/astro-publish-root.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: corexlyth-static-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Compile checked Astro files into the existing Pages root
    if: github.repository == 'corexlyth/corexlyth-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static Astro site
        run: npm run build
      - name: Check generated links, routes and assets
        run: npm run verify
      - name: Copy verified output to the current root-based Pages source
        run: |
          cp -a dist/. .
          test -f .nojekyll || touch .nojekyll
          git add -- index.html 404.html .nojekyll assets/ arsiv/ kategori/ etiket/ yazi/ ara/ rss.xml robots.txt sitemap-index.xml sitemap-0.xml pagefind/
          if git diff --cached --quiet; then
            echo "Compiled output is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: refresh CoreXLyth static Pages output"
            git push origin HEAD:main
          fi
      - name: Request Pages rebuild after bot commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" >/dev/null
