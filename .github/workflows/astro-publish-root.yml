name: CoreXLyth • Publish verified Astro output

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/astro-publish-root.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: corexlyth-static-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Compile checked Astro files into the existing Pages root
    if: github.repository == 'corexlyth/corexlyth-site' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check public publication fingerprint
        id: content
        run: node scripts/prepare-content.mjs
      - name: Build static Astro site
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        run: npm run build
      - name: Check generated links, routes and assets
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        run: npm run verify
      - name: Copy verified output to the current root-based Pages source
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        run: |
          rm -rf -- yazi kategori etiket arsiv ara hesap _astro pagefind assets
          cp -a dist/. .
          test -f .nojekyll || touch .nojekyll
          git add -A -- .
          if git diff --cached --quiet; then
            echo "Compiled output is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: refresh CoreXLyth static Pages output"
            git push origin HEAD:main
          fi
      - name: Request Pages rebuild after bot commit
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" >/dev/null
